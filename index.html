<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tekxai Task Management | Platform</title>
  <link rel="icon" type="image/svg+xml" href="/src/assets/icons/tekxai-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.tekxai.services" crossorigin>
  <link rel="dns-prefetch" href="https://api.tekxai.services">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="preload" href="/src/assets/icons/tekxai-logo.svg" as="image" type="image/svg+xml" fetchpriority="high">
</head>

<body>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('tekxai-theme');
        if (t && t !== 'clean-light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* localStorage unavailable — Clean Light default renders as before */ }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
